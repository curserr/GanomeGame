
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
    <title>My First Game</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: lightblue;
        }

        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
            background-color: black;
        }

        #player {
            position: absolute;
            left: 100px;
            top: 100px;
			width: 5vw;
			height: auto;
            user-select: none;
	    -webkit-user-drag: none;	
        }
	
	 .flipped {transform: scaleX(-1);}

        #platform
        {
	width:300px;
        height:3px;
        background-color: black;
	}
        
    </style>
</head>

<body>

    <div id="game"> 
        <img id="player" src="littlegnomeboi2.png"/>
        
    </div>

    <script>

        let player = document.getElementById("player");
        let game = document.getElementById("game");

        let PlayerX = 0;
        let PlayerY = window.innerHeight / 2;
        const OriginalY = PlayerY;

        let speed = 4;
        let JumpSpeed = 0;
	let JumpHeight = window.innerHeight / 6;
	let FallSpeed = 2;
        let PlayerJump = false;
        let PlayerOnGround = true;
        let DoubleJump = false;
	let LeftPlayer = false;
	let RightPlayer = true;


        let keys = {};

        document.addEventListener("keydown", function(event) {
            keys[event.key.toLowerCase()] = true;

            if (["arrowup", "arrowdown", "arrowleft", "arrowright"," "].includes(event.key.toLowerCase())) {
                event.preventDefault();
            }
        });

        document.addEventListener("keyup", function(event) {
            keys[event.key.toLowerCase()] = false;
        });

        function MovePlayer()
        {
        	if(OriginalY <= PlayerY)
            {
		PlayerOnGround = true;
                DoubleJump = false;
            }
            else PlayerOnGround = false;
        
            if (keys["arrowleft"])
            {
		LeftPlayer = true; 
		RightPlayer = false;
                PlayerX -= speed;
            }

            if ( keys["arrowright"])
            {
		LeftPlayer = false;
		RightPlayer = true;
                PlayerX += speed;
            }
            
            if( keys[" "] && (PlayerOnGround || !DoubleJump))
            {
            	PlayerJump = true;
                JumpSpeed = 5;
                DoubleJump = true;
            }
		
            if(LeftPlayer) player.classList.add("flipped");
	    else if(RightPlayer) player.classList.add("flipped");	

            if(PlayerJump && JumpSpeed == 5)
            {
            	Jump();
			}
            
            if(!PlayerJump && OriginalY > PlayerY)
            {
            	Gravity();
            }
            
            if(PlayerY>OriginalY) PlayerY = OriginalY;

            // Keep Player inside the game area

            PlayerX = Math.max(0, Math.min(PlayerX, game.clientWidth - player.offsetWidth));
            PlayerY = Math.max(0, Math.min(PlayerY, game.clientHeight - player.offsetHeight));

            Player.style.left = PlayerX + "px";
            Player.style.top = PlayerY + "px";

            requestAnimationFrame(MovePlayer);
        }
        
        function Jump()
        {
	    	if(OriginalY - PlayerY < JumpHeight)
			{
				PlayerY -= JumpSpeed;
			}
            
            else
            {
            	PlayerJump = false;
            	JumpSpeed = 0;
            }
		}
        
       function Gravity()
        {
	 			PlayerY += FallSpeed;
        }
        
        
        //function Gnome(let health, )
        

        MovePlayer();
	//setTimeout(gravity,milliseconds)

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>My First Game</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background-color: lightblue;
    }

    #game {
        width: 100vw;
        height: 100vh;
        position: relative;
        background-color: black;
    }

    #PlayerIdle	 {
        position: absolute;
        left: 100px;
        top: 100px;
        width: 5vw;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
    }

    .flipped { transform: scaleX(-1); }

    #platform {
        width: 300px;
        height: 3px;
        background-color: black;
    }
</style>
</head>

<body>

<div id="game">
    <img id="PlayerIdle" src="littlegnomeboi2.png"/>
    <img id = "Platform" src = "TerrainPlatform1.png" />
    <img id = "PlayerWalking" />
    <img id = "PlayerJumping" />
    <audio id="bgMusic1" src="AmbientBackground1.mp3" loop></audio>
</div>

<script>
	let CurrentRoom = 0;	

	let PlayerIdle = document.getElementById("PlayerIdle");
	let game = document.getElementById("game");
	let PlayerIdle = document.getElementById("PlayerWalking");

	let PlayerX = 0;
	let PlayerY = window.innerHeight / 2;
	const OriginalY = PlayerY;
	let StartY = PlayerY;        // where the current jump began

	let speed = 4;
	let JumpSpeed = 5;
	let JumpHeight = window.innerHeight / 6;
	let FallSpeed = 2;

	let PlayerJump = false;      // true while rising
	let PlayerOnGround = true;
	let JumpsUsed = 0;
	const MaxJumps = 2;          // 2 = double jump
	let SpaceWasDown = false;    // used to detect a fresh key press
	let PlayerMove = false;	// used to detect whether the character is moving 

	let LeftPlayer = false;      // true = facing left

	let keys = {};

	document.addEventListener("keydown", function(event) {
	keys[event.key.toLowerCase()] = true;

        if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(event.key.toLowerCase())) {
            event.preventDefault();
        }
    });

	document.addEventListener("keyup", function(event) {
        keys[event.key.toLowerCase()] = false;
    });

	function MovePlayer()
    	{
        	// Ground check
	        PlayerOnGround = (PlayerY >= OriginalY);
        	if (PlayerOnGround && !PlayerJump) JumpsUsed = 0;
	
		// detect whether the player is moving
		while(PlayerOnGround && PlayerMove)
		{
			
			
		}


	        // Horizontal movement and facing direction
	        if (keys["arrowleft"])
	        {
	            LeftPlayer = true;
	            PlayerX -= speed;
	        }
	
	        if (keys["arrowright"])
	        {
	            LeftPlayer = false;
        	    PlayerX += speed;
	        }
	
	        Player.classList.toggle("flipped", LeftPlayer);
	
	        // Start a jump only on a fresh press of space
	        if (keys[" "] && !SpaceWasDown && JumpsUsed < MaxJumps)
	        {
	            PlayerJump = true;
	            JumpsUsed++;
	            StartY = PlayerY;
	        }
	        SpaceWasDown = !!keys[" "];
	
	        // Rising or falling
	        if (PlayerJump)
	        {
	            Jump();
	        }
	        else if (PlayerY < OriginalY)
	        {
	            Gravity();
	        }
	
	        if (PlayerY > OriginalY) PlayerY = OriginalY;
	
	        // Keep Player inside the game area
	        PlayerX = Math.max(0, Math.min(PlayerX, game.clientWidth - Player.offsetWidth));
	        PlayerY = Math.max(0, Math.min(PlayerY, game.clientHeight - Player.offsetHeight));
	
	        Player.style.left = PlayerX + "px";
	        Player.style.top = PlayerY + "px";
	
	        requestAnimationFrame(MovePlayer);
	}
	
	function Jump()
	{
		if (StartY - PlayerY < JumpHeight)
	        {
		            PlayerY -= JumpSpeed;
        	}
        	else
        	{
	            PlayerJump = false;
        	}
	}

    	function Gravity()
    	{
     	   PlayerY += FallSpeed;
    	}

	MovePlayer();

	let bgMusic1 = document.getElementById("bgMusic1");
	bgMusic1.volume = 0.4;   // 0 to 1

	function StartMusic()
	{
    	bgMusic1.play();
    	document.removeEventListener("keydown", StartMusic);
        document.removeEventListener("click", StartMusic);
	}

	document.addEventListener("keydown", UnlockMusic);
	document.addEventListener("click", UnlockMusic);

// Start in the first room
	//ChangeRoom("start");

</script>

</body>
</html>

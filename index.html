
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yara's Birthday ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #ffb6d9, #ffc6e8, #ffe0f0);
    height: 100vh;
    color: #a82c69;
}

/* Main screen */

#screen {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Floating decorations */

.decoration {
    position: absolute;
    pointer-events: none;
    user-select: none;
    animation: float 4s ease-in-out infinite;
    z-index: 1;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(-10deg);
    }
    50% {
        transform: translateY(-20px) rotate(10deg);
    }
}

/* Main question */

#questionBox {
    position: relative;
    z-index: 5;
    text-align: center;
    background: rgba(255,255,255,0.78);
    padding: 45px 35px;
    border-radius: 30px;
    width: min(90%, 550px);
    box-shadow: 0 10px 40px rgba(180, 50, 110, 0.2);
}

#questionBox h1 {
    font-size: clamp(28px, 5vw, 45px);
    margin: 0 0 35px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 25px;
}

button {
    border: none;
    border-radius: 30px;
    padding: 15px 35px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
}

button:hover {
    transform: scale(1.1);
}

#yesButton {
    background: #ff4f9a;
    color: white;
}

#noButton {
    background: #777;
    color: white;
    z-index: 10;
}

/* Popup message */

#popup {
    display: none;
    position: absolute;
    z-index: 20;
    background: white;
    padding: 35px;
    width: min(85%, 400px);
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    animation: popupAppear 0.3s ease-out;
}

#popup h2 {
    margin: 0;
    font-size: 27px;
}

@keyframes popupAppear {
    from {
        transform: scale(0.5);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

/* Birthday ending */

#birthdayScreen {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 15;
    background: linear-gradient(135deg, #ff8fc7, #ffb6d9, #ffe0ef);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}

#birthdayScreen h1 {
    font-size: clamp(40px, 9vw, 85px);
    color: white;
    text-shadow: 4px 5px 0 #e83c91;
    margin: 0;
    animation: birthdayBounce 1s infinite alternate;
}

#birthdayScreen h2 {
    color: white;
    font-size: clamp(22px, 4vw, 35px);
}

@keyframes birthdayBounce {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
}

/* Fireworks canvas */

#fireworks {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 16;
}
</style>
</head>

<body>

<div id="screen">

    <!-- Floating decorations are created using JavaScript -->

    <div id="questionBox">
        <h1>Is Yara the favourite? ❤️</h1>

        <div class="buttons">
            <button id="yesButton">YES!! 💗</button>
            <button id="noButton">NO 😈</button>
        </div>
    </div>

    <div id="popup">
        <h2>KILL YOURSELF</h2>
      </div>

    <div id="birthdayScreen">
        <canvas id="fireworks"></canvas>
        <h1>HAPPY BIRTHDAY YARA!! 🎂</h1>
        <h2>YOU ARE THE FAVOURITE ❤️</h2>
        <h2>Hope you have the best day ever!! 💗</h2>
	<h3>
	<a href="https://ecardforest.com/card/?token=3.X2dqMVRCVnRVIn0.lTSOsah5vDnLivSAymPWBf-gLtNoo_9gSChpaXP_mY8"> Click here! 😁</a>
	</h3>
    </div>

</div>

<!-- AUDIO FILES -->

<audio id="backgroundAudio" loop>
    <source src="Nothing.mp4" type="audio/mpeg">
</audio>

<audio id="noAudio">
    <source src="denied.mp3" type="audio/mpeg">
</audio>

<audio id="birthdayAudio">
    <source src="HappyBirthdaySong.mp4" type="audio/mp4">
</audio>

<script>

// ========================================
// 1. AUDIO
// ========================================

const backgroundAudio = document.getElementById("backgroundAudio");
const noAudio = document.getElementById("noAudio");
const birthdayAudio = document.getElementById("birthdayAudio");

backgroundAudio.volume = 0.35;
noAudio.volume = 0.8;
birthdayAudio.volume = 0.7;

// Browsers often block autoplay.
// Start background music after the first interaction.

let audioStarted = false;

function startBackgroundAudio() {
    if (!audioStarted) {
        audioStarted = true;
        backgroundAudio.play().catch(() => {});
    }
}

document.addEventListener("click", startBackgroundAudio, { once: true });


// ========================================
// 2. FLOATING DECORATIONS
// ========================================

const screen = document.getElementById("screen");

const decorations = [
    "❤️", "💕", "💗", "💖",
    "🎉", "🥳", "🎂", "🎈",
    "💝", "💓"
];

function createDecorations() {

    for (let i = 0; i < 35; i++) {

        const decoration = document.createElement("div");

        decoration.className = "decoration";

        decoration.textContent =
            decorations[Math.floor(Math.random() * decorations.length)];

        decoration.style.left = Math.random() * 100 + "%";
        decoration.style.top = Math.random() * 100 + "%";

        decoration.style.fontSize =
            (20 + Math.random() * 25) + "px";

        decoration.style.animationDelay =
            Math.random() * 4 + "s";

        decoration.style.animationDuration =
            (3 + Math.random() * 4) + "s";

        screen.appendChild(decoration);
    }
}

createDecorations();


// ========================================
// 3. NO BUTTON
// ========================================


const noButton = document.getElementById("noButton");
const popup = document.getElementById("popup");

let noAttempts = 0;

noButton.addEventListener("click", function() {

    startBackgroundAudio();

    noAttempts++;

    // Play alternative audio

    backgroundAudio.pause();

    noAudio.currentTime = 0;
    noAudio.play().catch(() => {});

    noAudio.onended = function() {
        backgroundAudio.play().catch(() => {});
    };

    // Move the button relative to the screen

    noButton.style.position = "fixed";

    const padding = 20;

    const maxX = window.innerWidth - noButton.offsetWidth - padding;
    const maxY = window.innerHeight - noButton.offsetHeight - padding;

    const randomX = padding + Math.random() * Math.max(0, maxX - padding);
    const randomY = padding + Math.random() * Math.max(0, maxY - padding);

    noButton.style.left = randomX + "px";
    noButton.style.top = randomY + "px";

    // Ensure it stays visible above everything

    noButton.style.zIndex = "30";

    // Show popup

    popup.style.display = "block";

setTimeout(function() {
    popup.style.display = "none";
}, 4000);

    if (noAttempts >= 3) {
        popup.innerHTML = `
            <h2>YARA. STOP. 😭</h2>
        `;
    }

})

// ========================================
// 4. YES BUTTON
// ========================================

const yesButton = document.getElementById("yesButton");
const questionBox = document.getElementById("questionBox");
const birthdayScreen = document.getElementById("birthdayScreen");

yesButton.addEventListener("click", function() {

    startBackgroundAudio();

    // Stop all previous audio

    backgroundAudio.pause();
    noAudio.pause();

    // Start birthday music

    birthdayAudio.currentTime = 0;
    birthdayAudio.play().catch(() => {});

    // Remove the question and popup

    questionBox.style.display = "none";
    popup.style.display = "none";

    // Show the birthday screen

    birthdayScreen.style.display = "flex";

    // Start fireworks

    startFireworks();

});


// ========================================
// 5. FIREWORKS
// ========================================

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];
let fireworksRunning = false;

function resizeCanvas() {

    const dpr = window.devicePixelRatio || 1;

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function createFirework(x, y) {

    const colours = [
        "#ff1744",
        "#ffeb3b",
        "#00e5ff",
        "#ff80ab",
        "#ffffff",
        "#b388ff",
        "#76ff03"
    ];

    const colour = colours[
        Math.floor(Math.random() * colours.length)
    ];

    const particleCount = 65;

    for (let i = 0; i < particleCount; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 5;

        particles.push({

            x: x,
            y: y,

            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,

            alpha: 1,
            decay: 0.008 + Math.random() * 0.015,

            colour: colour,
            size: 2 + Math.random() * 2

        });
    }
}

function animateFireworks() {

    if (!fireworksRunning) return;

    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    // Randomly launch new fireworks

    if (Math.random() < 0.08) {

        createFirework(
            Math.random() * window.innerWidth,
            Math.random() * window.innerHeight * 0.65
        );
    }

    // Update and draw particles

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vy += 0.035;

        p.vx *= 0.99;
        p.vy *= 0.99;

        p.alpha -= p.decay;

        ctx.globalAlpha = Math.max(0, p.alpha);

        ctx.fillStyle = p.colour;

        ctx.beginPath();

        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

        ctx.fill();

        if (p.alpha <= 0) {
            particles.splice(i, 1);
        }
    }

    ctx.globalAlpha = 1;

    requestAnimationFrame(animateFireworks);
}

function startFireworks() {

    if (fireworksRunning) return;

    fireworksRunning = true;

    // Initial fireworks immediately

    for (let i = 0; i < 8; i++) {

        createFirework(
            Math.random() * window.innerWidth,
            Math.random() * window.innerHeight * 0.6
        );
    }

    animateFireworks();
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>My First Game</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background-color: lightblue;
    }

    #game {
        width: 100vw;
        height: 100vh;
        position: relative;
        background-color: black;
    }

    /* All three player sprites share the same positioning rules */
    #PlayerIdle, #PlayerWalking, #PlayerJumping {
        position: absolute;
        left: 100px;
        top: 100px;
        width: 5vw;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
    }

    /* Only the idle sprite is visible for now */
    #PlayerWalking, #PlayerJumping {
        display: none;
    }

    .flipped { transform: scaleX(-1); }

    /* Placeholder position, adjust to fit your terrain image */
    #Platform {
        position: absolute;
        left: 0;
        top: calc(50vh + 5vw);
        width: 300px;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
    }
</style>
</head>

<body>

<div id="game">
    <img id="PlayerIdle" src="littlegnomeboi2.png"/>
    <img id="PlayerWalking"/>
    <img id="PlayerJumping"/>
    <img id="Platform" src="TerrainPlatform1.png"/>
    <audio id="bgMusic1" src="AmbientBackground1.mp3" loop></audio>
</div>

<script>
    let CurrentRoom = 0;

    let game          = document.getElementById("game");
    let PlayerIdle    = document.getElementById("PlayerIdle");
    let PlayerWalking = document.getElementById("PlayerWalking");
    let PlayerJumping = document.getElementById("PlayerJumping");

    // Every sprite gets the same position and flip, so switching sprites later is easy
    let PlayerSprites = [PlayerIdle, PlayerWalking, PlayerJumping];

    let PlayerX = 0;
    let PlayerY = window.innerHeight / 2;
    const OriginalY = PlayerY;
    let StartY = PlayerY;        // where the current jump began

    let speed = 4;
    let JumpSpeed = 5;
    let JumpHeight = window.innerHeight / 6;
    let FallSpeed = 2;

    let PlayerJump = false;      // true while rising
    let PlayerOnGround = true;
    let JumpsUsed = 0;
    const MaxJumps = 2;          // 2 = double jump
    let SpaceWasDown = false;    // used to detect a fresh key press
    let PlayerMove = false;      // true while an arrow key is moving the character

    let LeftPlayer = false;      // true = facing left

    let keys = {};

    document.addEventListener("keydown", function(event) {
        keys[event.key.toLowerCase()] = true;

        if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(event.key.toLowerCase())) {
            event.preventDefault();
        }
    });

    document.addEventListener("keyup", function(event) {
        keys[event.key.toLowerCase()] = false;
    });

    function MovePlayer()
    {
        // Ground check
        PlayerOnGround = (PlayerY >= OriginalY);
        if (PlayerOnGround && !PlayerJump) JumpsUsed = 0;

        // Horizontal movement and facing direction
        PlayerMove = false;

        if (keys["arrowleft"])
        {
            LeftPlayer = true;
            PlayerMove = true;
            PlayerX -= speed;
        }

        if (keys["arrowright"])
        {
            LeftPlayer = false;
            PlayerMove = true;
            PlayerX += speed;
        }

        // Later: switch to the walking sprite here
        if (PlayerOnGround && PlayerMove)
        {
            // show PlayerWalking, hide the others
        }

        // Start a jump only on a fresh press of space
        if (keys[" "] && !SpaceWasDown && JumpsUsed < MaxJumps)
        {
            PlayerJump = true;
            JumpsUsed++;
            StartY = PlayerY;
        }
        SpaceWasDown = !!keys[" "];

        // Rising or falling
        if (PlayerJump)
        {
            Jump();
        }
        else if (PlayerY < OriginalY)
        {
            Gravity();
        }

        if (PlayerY > OriginalY) PlayerY = OriginalY;

        // Keep the player inside the game area
        PlayerX = Math.max(0, Math.min(PlayerX, game.clientWidth - PlayerIdle.offsetWidth));
        PlayerY = Math.max(0, Math.min(PlayerY, game.clientHeight - PlayerIdle.offsetHeight));

        // Copy the JS numbers onto every sprite
        for (let sprite of PlayerSprites)
        {
            sprite.style.left = PlayerX + "px";
            sprite.style.top = PlayerY + "px";
            sprite.classList.toggle("flipped", LeftPlayer);
        }

        requestAnimationFrame(MovePlayer);
    }

    function Jump()
    {
        if (StartY - PlayerY < JumpHeight)
        {
            PlayerY -= JumpSpeed;
        }
        else
        {
            PlayerJump = false;
        }
    }

    function Gravity()
    {
        PlayerY += FallSpeed;
    }

    MovePlayer();

    // Background music: browsers only allow sound after the first key press or click
    let bgMusic = document.getElementById("bgMusic1");
    bgMusic.volume = 0.4;   // 0 to 1

    function StartMusic()
    {
        bgMusic.play();
        document.removeEventListener("keydown", StartMusic);
        document.removeEventListener("click", StartMusic);
    }

    document.addEventListener("keydown", StartMusic);
    document.addEventListener("click", StartMusic);
</script>

</body>
</html>
